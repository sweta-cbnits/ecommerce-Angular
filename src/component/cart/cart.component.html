<h2 style="text-align: center">Your Cart</h2>

<div *ngIf="cartItems.length === 0" style="text-align: center">
  Cart is empty 🛒
</div>

<div *ngFor="let item of cartItems" class="cart-item">
  <img [src]="item.image" width="80" />

  <div>
    <h4>{{ item.title }}</h4>
    <p>Price: ₹{{ item.price }}</p>
    <p>Quantity: {{ item.quantity }}</p>
    <p>Total: ₹{{ item.price * item.quantity }}</p>

    <button class="card-btn" (click)="removeItem(item.id)">Remove</button>
  </div>
</div>

<hr />

<h3 *ngIf="cartItems.length > 0">Grand Total: ₹{{ total }}</h3>
